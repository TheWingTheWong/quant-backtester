[project]
name = "quant-backtester"
version = "0.1.0"
description = "A fast, vectorized backtesting engine for systematic trading strategies"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ansorjon Juraev" }]
requires-python = ">=3.10"
keywords = ["backtesting", "quant", "trading", "finance", "pandas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]

[project.scripts]
qbt = "qbt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
